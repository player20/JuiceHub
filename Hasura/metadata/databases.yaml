- name: default
  kind: postgres
  configuration:
    connection_info:
      use_prepared_statements: false
      database_url:
        from_env: HASURA_GRAPHQL_DATABASE_URL
      isolation_level: read-committed
      pool_settings:
        connection_lifetime: 600
        retries: 1
        idle_timeout: 180
        max_connections: 50
  tables:
    - table:
        schema: public
        name: Tenants
    - table:
        schema: public
        name: ChargingStations
    - table:
        schema: public
        name: Transactions
    - table:
        schema: public
        name: TransactionEvents
    - table:
        schema: public
        name: Authorizations
    - table:
        schema: public
        name: Locations
    - table:
        schema: public
        name: Evses
    - table:
        schema: public
        name: Connectors
    - table:
        schema: public
        name: MeterValues
    - table:
        schema: public
        name: Components
    - table:
        schema: public
        name: Variables
    - table:
        schema: public
        name: VariableAttributes
    - table:
        schema: public
        name: VariableMonitoring
    - table:
        schema: public
        name: Tariffs
    - table:
        schema: public
        name: Subscriptions
    - table:
        schema: public
        name: Certificates
    - table:
        schema: public
        name: SecurityEvents
    - table:
        schema: public
        name: StatusNotifications
    - table:
        schema: public
        name: BootNotifications
    - table:
        schema: public
        name: Reservations
